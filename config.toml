baseURL = "https://lphin.github.io/"
languageCode = "en-us"
title = "LPhin"
publishDir = "public"

# Pagination settings
[pagination]
    pagerSize = 3
    path = "page"

# Site parameters
[params]
    description = "An (un)professional game dev and nerd"
    subtitle = "An (un)professional game dev and nerd"
    
    # Social links
    email = "nhanphan98@protonmail.com"
    github = "https://github.com/lphin0"
    youtube = "https://youtube.com/@lphin98"
    twitter = "https://twitter.com/lphin98"

# Taxonomies
[taxonomies]
    tag = "tags"
    category = "categories"

# Markdown settings
[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
    [markup.highlight]
        style = "monokai"

# Privacy settings
[privacy]
    [privacy.x]
        disable = false
        enableDNT = true
        simple = true
    [privacy.youtube]
        disable = false
        privacyEnhanced = true

# Output settings
[outputs]
    home = ["HTML", "RSS"]
    page = ["HTML"]
    section = ["HTML", "RSS"]
    taxonomy = ["HTML"]
    term = ["HTML"]