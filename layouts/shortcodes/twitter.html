{{- if not (.Get "link") -}}
<blockquote class="twitter-tweet">
  <a href="https://twitter.com/{{ .Get 0 }}/status/{{ .Get 1 }}"></a>
</blockquote>
<script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
{{- else -}}
<a href="https://twitter.com/{{ .Get 0 }}/status/{{ .Get 1 }}" target="_blank" rel="noopener noreferrer">
  View on X/Twitter
</a>
{{- end -}}
