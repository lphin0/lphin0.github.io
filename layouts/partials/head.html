    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
    {{ if .Description }}
    <meta name="description" content="{{ .Description }}">
    {{ else if .Site.Params.description }}
    <meta name="description" content="{{ .Site.Params.description }}">
    {{ end }}
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
    {{ if .Description }}
    <meta property="og:description" content="{{ .Description }}">
    {{ else if .Site.Params.description }}
    <meta property="og:description" content="{{ .Site.Params.description }}">
    {{ end }}
    {{ if .IsPage }}
    <meta property="og:type" content="article">
    {{ else }}
    <meta property="og:type" content="website">
    {{ end }}
    <meta property="og:url" content="{{ .Permalink }}">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
    {{ if .Description }}
    <meta name="twitter:description" content="{{ .Description }}">
    {{ else if .Site.Params.description }}
    <meta name="twitter:description" content="{{ .Site.Params.description }}">
    {{ end }}
    
    <!-- RSS Feed -->
    {{ with .OutputFormats.Get "RSS" }}
    <link href="{{ .RelPermalink }}" rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}">
    {{ end }}
    
    <!-- Favicon -->
    <link rel="icon" href="{{ "favicon.ico" | relURL }}" sizes="any">
    <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
    <link rel="icon" href="{{ "favicon-96x96.png" | relURL }}" sizes="96x96" type="image/png">
    <link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}" sizes="180x180">
    <link rel="manifest" href="{{ "manifest.json" | relURL }}">
    <meta name="theme-color" content="#{{ with .Site.Params.themeColor }}{{ . }}{{ else }}ffffff{{ end }}">
    
    <link rel="stylesheet" href="{{ "styles.css" | relURL }}">
