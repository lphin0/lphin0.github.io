<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blog post">
    <title>Blog Post - Game Developer Portfolio</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .blog-post {
            max-width: 800px;
            margin: 0 auto;
            padding: 6rem 2rem;
        }
        
        .blog-header {
            margin-bottom: 3rem;
        }
        
        .blog-meta {
            color: var(--text-light);
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        
        .blog-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--primary-color);
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        
        .blog-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        
        .blog-content {
            line-height: 1.8;
            font-size: 1.1rem;
        }
        
        .blog-content h2 {
            font-size: 1.8rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }
        
        .blog-content h3 {
            font-size: 1.4rem;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--accent-color);
        }
        
        .blog-content p {
            margin-bottom: 1.5rem;
            color: var(--text-color);
        }
        
        .blog-content ul,
        .blog-content ol {
            margin-bottom: 1.5rem;
            padding-left: 2rem;
        }
        
        .blog-content li {
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }
        
        .blog-content code {
            background-color: var(--bg-alt);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-family: 'Courier New', monospace;
            color: var(--primary-color);
        }
        
        .blog-content pre {
            background-color: var(--bg-alt);
            padding: 1.5rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
        }
        
        .blog-content pre code {
            background-color: transparent;
            padding: 0;
        }
        
        .blog-content blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 1.5rem;
            margin: 1.5rem 0;
            color: var(--text-light);
            font-style: italic;
        }
        
        .blog-back {
            display: inline-block;
            margin-top: 3rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }
        
        .blog-back:hover {
            color: var(--primary-dark);
            text-shadow: 0 0 10px var(--primary-color);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="nav-logo">DEV.PORTFOLIO</a>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu">
                <li><a href="../index.html#home" class="nav-link">Home</a></li>
                <li><a href="../index.html#about" class="nav-link">About</a></li>
                <li><a href="../index.html#projects" class="nav-link">Projects</a></li>
                <li><a href="../index.html#blog" class="nav-link">Blog</a></li>
                <li><a href="../index.html#contact" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <article class="blog-post">
        <header class="blog-header">
            <div class="blog-meta">
                <span id="post-date"></span> • <span id="post-read-time"></span>
            </div>
            <h1 class="blog-title" id="post-title"></h1>
            <div class="blog-tags" id="post-tags"></div>
        </header>
        
        <div class="blog-content" id="post-content">
            <!-- Content will be inserted here -->
        </div>
        
        <a href="../index.html#blog" class="blog-back">← Back to Blog</a>
    </article>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Game Developer Portfolio. All rights reserved.</p>
            <div class="social-links">
                <a href="https://github.com/yourusername" target="_blank" rel="noopener noreferrer">GitHub</a>
                <a href="https://linkedin.com/in/yourusername" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                <a href="https://twitter.com/yourusername" target="_blank" rel="noopener noreferrer">Twitter</a>
            </div>
        </div>
    </footer>

    <script src="../script.js"></script>
</body>
</html>
