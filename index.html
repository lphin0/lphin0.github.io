<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="#home" class="nav-logo">Name</a>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu">
                <li><a href="#home" class="nav-link">Home</a></li>
                <li><a href="#about" class="nav-link">About</a></li>
                <li><a href="#projects" class="nav-link">Projects</a></li>
                <li><a href="#blog" class="nav-link">Blog</a></li>
                <li><a href="#contact" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <section id="home" class="hero">
            <div class="hero-content">
                <h1 class="hero-title">Your Name</h1>
                <p class="hero-subtitle">Your Title</p>
            </div>
        </section>

        <section id="about" class="section">
            <div class="container">
                <h2 class="section-title">About</h2>
                <div class="about-content">
                    <p>Your about text goes here.</p>
                </div>
            </div>
        </section>

        <section id="projects" class="section section-alt">
            <div class="container">
                <h2 class="section-title">Projects</h2>
                <div class="projects-grid">
                    <!-- Add projects here -->
                </div>
            </div>
        </section>

        <section id="blog" class="section">
            <div class="container">
                <h2 class="section-title">Blog</h2>
                <div class="blog-list">
                    <!-- Add blog posts here -->
                </div>
            </div>
        </section>

        <section id="contact" class="section section-alt">
            <div class="container">
                <h2 class="section-title">Contact</h2>
                <div class="contact-content">
                    <div class="contact-info">
                        <p>Find me on:</p>
                        <div class="contact-links">
                            <a href="mailto:your.email@example.com" class="contact-link">Email</a>
                            <a href="https://github.com/yourusername" target="_blank" rel="noopener noreferrer" class="contact-link">GitHub</a>
                            <a href="https://linkedin.com/in/yourusername" target="_blank" rel="noopener noreferrer" class="contact-link">LinkedIn</a>
                            <a href="https://twitter.com/yourusername" target="_blank" rel="noopener noreferrer" class="contact-link">Twitter</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
